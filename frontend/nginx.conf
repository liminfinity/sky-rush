# Only accept the two protocol values; the host port is loopback-only.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Optional deployment-only controls; no files are installed for local Compose.
    include /etc/nginx/skyrush-server/*.conf;

    # Resolve the Compose service again after a backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/(api/|swagger-ui(?:/|\.html$)|v3/api-docs(?:/|$)|actuator/health$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        # Keep redirects on the incoming origin, including Swagger.
        proxy_redirect ~^http://[^/]+(/.*)$ $origin_scheme://$http_host$1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
