# Only Caddy can be reached from outside Docker. It replaces untrusted incoming XFF.
# Empty keys bypass limiting, so game/leaderboard polling is unaffected.
map "$request_method:$uri" $auth_limit_key {
    default "";
    "POST:/api/auth/login" $http_x_forwarded_for;
    "POST:/api/auth/register" $http_x_forwarded_for;
}
limit_req_zone $auth_limit_key zone=auth:1m rate=10r/m;
