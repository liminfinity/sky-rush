plugins {
	id 'java'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.10.2'
	id 'com.github.spotbugs' version '6.5.11'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

// Patch/minor advisory fixes. Keep Spring Boot and Jackson on their existing major lines.
ext['commons-lang3.version'] = '3.20.0'
ext['jackson-bom.version'] = '2.21.5'
ext['log4j2.version'] = '2.25.5'
// 10.1.58 referenced by OSV was not published to Central; 10.1.59 includes the fix.
ext['tomcat.version'] = '10.1.59'
ext['postgresql.version'] = '42.7.12'

group = 'com.skyrush'
version = '0.0.1-SNAPSHOT'

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8:17.11.0'
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8:17.11.0'
}

dependencyManagement {
	imports { mavenBom 'io.zonky.test.postgres:embedded-postgres-binaries-bom:17.11.0' }
}

tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = 'skyrush.jar' }

spotless {
	java {
		googleJavaFormat('1.28.0')
		removeUnusedImports()
		formatAnnotations()
	}
	groovyGradle {
		target '*.gradle'
		greclipse('4.35')
	}
}
checkstyle {
	toolVersion = '10.26.1'
	maxWarnings = 0
}
spotbugs {
	toolVersion = '4.10.4'
	excludeFilter = file('config/spotbugs/exclude.xml')
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
}
// Analyze production bytecode; JUnit fixtures are covered by compilation and Checkstyle.
tasks.named('spotbugsTest') { enabled = false }
tasks.named('spotbugsMain') {
	reports {
		html { required = true }
		xml { required = true }
	}
}
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:all', '-parameters']
}



// Export resolved runtime coordinates, not declared versions, for the optional online audit.
tasks.register('runtimeDependencyManifest') {
	def destination = layout.buildDirectory.file('reports/dependencies/runtime.json')
	outputs.file(destination)
	// Always resolve afresh when explicitly auditing dependencies.
	outputs.upToDateWhen { false }
	doLast {
		def dependencies = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
			def id = it.moduleVersion.id
			[package: [ecosystem: 'Maven', name: "${id.group}:${id.name}"], version: id.version]
		}.unique().sort { it.package.name }
		def output = destination.get().asFile
		output.parentFile.mkdirs()
		output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(dependencies)) + '\n'
	}
}
